<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
        <div class="text-6xl mb-4">✅</div>
        <h2 class="text-2xl font-bold text-green-600 mb-2">Payment Successful!</h2>
        <p class="text-gray-600 mb-4">Your transaction has been completed.</p>
        <p id="trx-id" class="text-sm text-gray-500 mb-6">Transaction ID: Loading...</p>
        <button onclick="window.location.href='index.html'" class="bg-sky-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-sky-700 transition">
            Return to Home
        </button>
    </div>

    <script>
        // Firebase Config (same as your main site)
        const firebaseConfig = {
            apiKey: "AIzaSyBxAXnqcD_RIDffjVvjjNccVUhf6C3FC7A",
            authDomain: "dream-topup-9c62c.firebaseapp.com",
            projectId: "dream-topup-9c62c",
            storageBucket: "dream-topup-9c62c.firebasestorage.app",
            messagingSenderId: "735854404348",
            appId: "1:735854404348:web:de7506362db75d17366d79"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Get transaction ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const trxId = urlParams.get('trx_id') || 'Unknown';

        document.getElementById('trx-id').innerHTML = `Transaction ID: <strong>${trxId}</strong>`;

        // Update user balance in Firestore
        auth.onAuthStateChanged(async (user) => {
            if (user && trxId !== 'Unknown') {
                try {
                    // Verify transaction with ZAMM Pay
                    const verifyUrl = `https://pay.zammbd.com/api/payment/verify?api_key=YOUR_API_KEY&trx_id=${trxId}`;
                    const response = await fetch(verifyUrl);
                    const data = await response.json();
                    
                    if (data.success && data.status === 'Completed') {
                        const amount = data.amount;
                        const userRef = db.collection('users').doc(user.uid);
                        
                        await db.runTransaction(async (t) => {
                            const doc = await t.get(userRef);
                            const currentBalance = doc.data()?.balance || 0;
                            t.update(userRef, { balance: currentBalance + parseInt(amount) });
                        });
                        
                        await db.collection('deposits').add({
                            userId: user.uid,
                            userEmail: user.email,
                            amount: parseInt(amount),
                            trxId: trxId,
                            status: 'approved',
                            method: 'ZAMM Pay',
                            date: new Date()
                        });
                    }
                } catch (error) {
                    console.error('Verification error:', error);
                }
            }
        });
    </script>
</body>
</html>
